<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

  // Apna same config yahan bhi lagayein
  const firebaseConfig = {
    apiKey: "AIzaSyDZf3ehDQ3YFxYcXbtBPltIdytByKEau2E",
    authDomain: "website-security-6e0c1.firebaseapp.com",
    projectId: "website-security-6e0c1",
    storageBucket: "website-security-6e0c1.firebasestorage.app",
    messagingSenderId: "329456167268",
    appId: "1:329456167268:web:d7026b07c55db7e8c1f271"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Login button par click hone par
  document.getElementById("loginBtn").addEventListener("click", () => {
    const email = document.querySelectorAll("input")[0].value;
    const password = document.querySelectorAll("input")[1].value;

    signInWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        alert("Login Successful! Welcome back.");
        window.location.href = "webfirst.html"; // Yahan apne homepage ka naam likhein
      })
      .catch((error) => {
        alert("Login Failed: " + error.message);
      });
  });
</script>
